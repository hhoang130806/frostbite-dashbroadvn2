<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reorder batch summary</title>
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --hold: #2a78d6; --reorder: #eb6834; --hold-tint: #e9f1fb; --reorder-tint: #fdeee7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121211; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --hold: #3987e5; --reorder: #d95926; --hold-tint: #16263a; --reorder-tint: #3a2218;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 32px 16px 48px; }
h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
.lede { color: var(--ink2); margin: 0 0 24px; }
section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; white-space: nowrap; }
th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink2); padding: 0 12px 8px; }
td { padding: 10px 12px; border-top: 2px solid var(--surface); }
th.num, td.num { text-align: right; }
tr.hold td { background: var(--hold-tint); }
tr.reorder td { background: var(--reorder-tint); }
td.decision { font-weight: 600; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; }
.hold .swatch, .swatch.hold { background: var(--hold); }
.reorder .swatch, .swatch.reorder { background: var(--reorder); }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--ink2); margin-bottom: 8px; }
svg { display: block; width: 100%; height: auto; font-family: inherit; }
svg .ink { fill: var(--ink); } svg .ink2 { fill: var(--ink2); } svg .muted { fill: var(--muted); }
svg .bar.hold { fill: var(--hold); } svg .bar.reorder { fill: var(--reorder); }
footer { color: var(--muted); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Reorder batch summary</h1>
  <p class="lede" id="lede"></p>

  <section>
    <h2>Decision by round</h2>
    <div class="scroll">
      <table>
        <thead><tr>
          <th>Round</th><th>Month</th><th class="num">Forecast</th><th class="num">Inventory</th>
          <th class="num">Weekly demand</th><th class="num">Weeks of supply</th><th>Decision</th><th class="num">Order quantity</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>Weeks of supply against the threshold</h2>
    <div class="legend">
      <span><span class="swatch hold"></span>Hold</span>
      <span><span class="swatch reorder"></span>Reorder now</span>
    </div>
    <div id="supplyChart"></div>
  </section>

  <section>
    <h2>Order quantity by round</h2>
    <div id="orderChart"></div>
  </section>

  <footer id="footer"></footer>
</main>
<script>
const DATA = [{"round":"A","month":"July","source":"round_a.txt","forecast":1544,"inventory":1450,"weeklyDemand":356.58,"weeksOfSupply":4.07,"decision":"HOLD","orderQty":0},{"round":"B","month":"October","source":"round_b.txt","forecast":1046,"inventory":700,"weeklyDemand":241.57,"weeksOfSupply":2.9,"decision":"REORDER NOW","orderQty":1233},{"round":"C","month":"January","source":"round_c.txt","forecast":890,"inventory":620,"weeklyDemand":205.54,"weeksOfSupply":3.02,"decision":"REORDER NOW","orderQty":1024},{"round":"D","month":"February","source":"round_d.txt","forecast":1500,"inventory":400,"weeklyDemand":346.42,"weeksOfSupply":1.15,"decision":"REORDER NOW","orderQty":2371}];
const CFG = {"threshold":4,"leadTime":3,"safetyBuffer":1,"targetWeeks":8,"weeksPerMonth":4.33,"generated":"2026-10-11 12:12"};

const num = (n, d) => n.toLocaleString('en-US', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cls = r => r.decision === 'HOLD' ? 'hold' : 'reorder';

document.getElementById('lede').textContent =
  'Reorder when supply is at or below ' + CFG.threshold + ' weeks (' + CFG.leadTime + ' lead time + ' +
  CFG.safetyBuffer + ' safety buffer). Orders restock to ' + CFG.targetWeeks + ' weeks of supply.';
document.getElementById('footer').textContent =
  'Weekly demand = forecast / ' + CFG.weeksPerMonth + '. Generated by reorder_tool.ps1 on ' + CFG.generated + '.';

const tbody = document.getElementById('rows');
DATA.forEach(r => {
  const tr = document.createElement('tr');
  tr.className = cls(r);
  const cells = [
    ['Round ' + r.round], [r.month], [num(r.forecast), 'num'], [num(r.inventory), 'num'],
    [num(r.weeklyDemand, 2), 'num'], [num(r.weeksOfSupply, 2), 'num'],
    [r.decision, 'decision'], [r.decision === 'HOLD' ? 'No order' : num(r.orderQty), 'num']
  ];
  cells.forEach(([text, c]) => {
    const td = document.createElement('td');
    if (c) td.className = c;
    if (c === 'decision') {
      const sw = document.createElement('span');
      sw.className = 'swatch';
      td.appendChild(sw);
    }
    td.appendChild(document.createTextNode(text));
    tr.appendChild(td);
  });
  tbody.appendChild(tr);
});

// rows: [{label, sub, value, valueText, valueSub, cls}]
function barChart(id, rows, max, step, axisTitle, line) {
  const W = 640, left = 110, right = 510, rowH = 46, top = 30;
  const bottom = top + rows.length * rowH;
  const x = v => left + (v / max) * (right - left);
  let s = '';
  for (let t = 0; t <= max + 1e-9; t += step) {
    if (t > 0) s += '<line x1="' + x(t) + '" y1="' + (top - 6) + '" x2="' + x(t) + '" y2="' + bottom + '" stroke="var(--grid)"/>';
    s += '<text class="muted" x="' + x(t) + '" y="' + (bottom + 18) + '" font-size="12" text-anchor="middle">' + num(t) + '</text>';
  }
  rows.forEach((r, i) => {
    const y = top + i * rowH + 8, xe = x(r.value), mid = y + 12;
    if (xe - left >= 4) {
      s += '<path class="bar ' + r.cls + '" d="M' + left + ',' + y + ' H' + (xe - 4) + ' Q' + xe + ',' + y + ' ' + xe + ',' + (y + 4) +
           ' V' + (y + 20) + ' Q' + xe + ',' + (y + 24) + ' ' + (xe - 4) + ',' + (y + 24) + ' H' + left + ' Z">' +
           '<title>' + esc(r.label + ': ' + r.valueText) + '</title></path>';
    }
    s += '<text class="ink" x="0" y="' + (mid - 1) + '" font-size="14" font-weight="600">' + esc(r.label) + '</text>';
    s += '<text class="ink2" x="0" y="' + (mid + 15) + '" font-size="12">' + esc(r.sub) + '</text>';
    s += '<text class="ink" x="' + W + '" y="' + (mid - 1) + '" font-size="14" font-weight="600" text-anchor="end">' + esc(r.valueText) + '</text>';
    s += '<text class="ink2" x="' + W + '" y="' + (mid + 15) + '" font-size="12" text-anchor="end">' + esc(r.valueSub) + '</text>';
  });
  s += '<line x1="' + left + '" y1="' + (top - 6) + '" x2="' + left + '" y2="' + bottom + '" stroke="var(--axis)"/>';
  if (line) {
    s += '<line x1="' + x(line.value) + '" y1="' + (top - 8) + '" x2="' + x(line.value) + '" y2="' + bottom +
         '" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>';
    s += '<text class="ink2" x="' + x(line.value) + '" y="14" font-size="12" text-anchor="middle">' + esc(line.label) + '</text>';
  }
  s += '<text class="muted" x="' + (left + right) / 2 + '" y="' + (bottom + 38) + '" font-size="12" text-anchor="middle">' + esc(axisTitle) + '</text>';
  document.getElementById(id).innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + (bottom + 46) + '" role="img" aria-label="' + esc(axisTitle) + ' by round">' + s + '</svg>';
}

const supplyMax = Math.max(CFG.threshold + 1, Math.ceil(Math.max(...DATA.map(r => r.weeksOfSupply))));
barChart('supplyChart', DATA.map(r => ({
  label: 'Round ' + r.round, sub: r.month, value: r.weeksOfSupply, cls: cls(r),
  valueText: num(r.weeksOfSupply, 2) + ' weeks', valueSub: r.decision === 'HOLD' ? 'Hold' : 'Reorder now'
})), supplyMax, 1, 'Weeks of supply on hand', { value: CFG.threshold, label: CFG.threshold + '-week reorder threshold' });

const orderMax = Math.max(500, Math.ceil(Math.max(...DATA.map(r => r.orderQty)) / 500) * 500);
barChart('orderChart', DATA.map(r => ({
  label: 'Round ' + r.round, sub: r.month, value: r.orderQty, cls: cls(r),
  valueText: r.decision === 'HOLD' ? 'No order' : num(r.orderQty) + ' units', valueSub: r.decision === 'HOLD' ? 'Hold' : 'Reorder now'
})), orderMax, orderMax > 2500 ? orderMax / 5 : 500, 'Order quantity (units)');
</script>
</body>
</html>
